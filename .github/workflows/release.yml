name: Release

# Push a tag like `v0.2.0` to release. The tag must equal the `version` in Cargo.toml.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify tag and tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match Cargo.toml version
        id: meta
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          crate_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "wombat-sessions") | .version')"
          if [ "${tag#v}" != "${crate_version}" ]; then
            echo "::error::tag ${tag} does not match Cargo.toml version ${crate_version}"
            exit 1
          fi
          echo "version=${crate_version}" >> "$GITHUB_OUTPUT"
          case "${crate_version}" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --all-targets --locked

      - name: Package dry run
        run: cargo publish --dry-run --locked

  build:
    name: build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # macos-14 is the only macOS label that schedules on this plan; macos-15/-intel/-latest stay
          # queued. Intel macOS users: `cargo install wombat-sessions`.
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test the built binary
        run: |
          ./target/${{ matrix.target }}/release/wombat --version
          ./target/${{ matrix.target }}/release/wombat --help | grep -q "doctor"

      - name: Package
        run: |
          name="wombat-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/wombat" LICENSE README.md "dist/${name}/"
          tar -C dist -czf "${name}.tar.gz" "${name}"
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: wombat-${{ matrix.target }}
          path: wombat-*.tar.gz*
          if-no-files-found: error

  github-release:
    name: github release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}

  publish-crate:
    name: publish to crates.io (trusted publishing)
    needs: [verify, build]
    runs-on: ubuntu-latest
    # Requires the crates.io Trusted Publisher config:
    #   repository NomaDamas/wombat, workflow release.yml, environment crates-io
    environment: crates-io
    permissions:
      contents: read
      id-token: write # lets crates-io-auth-action exchange the GitHub OIDC token
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Skip if this version is already on crates.io
        id: already
        run: |
          set -euo pipefail
          status="$(curl -s -o /dev/null -w '%{http_code}' -A 'wombat-release (github.com/NomaDamas/wombat)' \
            "https://crates.io/api/v1/crates/wombat-sessions/${{ needs.verify.outputs.version }}")"
          if [ "${status}" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "wombat-sessions ${{ needs.verify.outputs.version }} is already on crates.io; skipping"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.already.outputs.published == 'false'
        id: auth

      - name: cargo publish
        if: steps.already.outputs.published == 'false'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
