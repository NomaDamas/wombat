[package]
name = "wombat-sessions"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
description = "Search your coding-agent session history (Codex, Claude Code, OpenCode, pi, omp, Hermes, Aside) with MinSync SPLADE + dense retrieval"
license = "MIT"
repository = "https://github.com/NomaDamas/wombat"
homepage = "https://github.com/NomaDamas/wombat"
readme = "README.md"
keywords = ["coding-agent", "session-search", "minsync", "splade", "rag"]
categories = ["command-line-utilities", "text-processing"]
exclude = [".github/", "AGENTS.md", "tests/fixtures/"]

[lib]
name = "wombat"
path = "src/lib.rs"

[[bin]]
name = "wombat"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
walkdir = "2.5"
zstd = "0.13"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
