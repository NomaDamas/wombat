[package]
name = "wombat"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Parse coding-agent session logs into a prefix-stable mirror indexed by MinSync"
license = "MIT"
repository = "https://github.com/NomaDamas/wombat"
readme = "README.md"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
walkdir = "2.5"
zstd = "0.13"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
